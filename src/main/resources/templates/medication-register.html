<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('薬歴登録')}">
  </head>
  <body>
    <header th:replace="~{fragments :: header}">
    </header>
    <nav th:replace="~{fragments :: nav}">
    </nav>
    <main>
      <div class="page-heading">
        <h1>
          薬歴登録
        </h1>
        <p>
          選択した患者の処方内容と服薬指導を記録します。
        </p>
      </div>
      <div th:replace="~{fragments :: patient}">
      </div>
      <section class="panel form-panel">
        <h2>
          処方・服薬情報
        </h2>
        <p class="muted">
          備考以外の項目はすべて必須です。
        </p>
        <form th:action="@{/patients/{id}/medications(id=${patient.id})}" th:object="${medicationHistoryForm}" method="post">
          <div class="form-grid">
            <div class="field">
              <label for="prescriptionDate">
                処方日
                <span class="required">
                  必須
                </span>
              </label>
              <input id="prescriptionDate" type="date" th:field="*{prescriptionDate}"  required>
              <p class="field-error" th:if="${#fields.hasErrors('prescriptionDate')}" th:errors="*{prescriptionDate}">
              </p>
            </div>
            <div class="field">
              <label for="medicineName">
                薬剤名
                <span class="required">
                  必須
                </span>
              </label>
              <input id="medicineName" type="text" th:field="*{medicineName}" maxlength="200" required>
              <p class="field-error" th:if="${#fields.hasErrors('medicineName')}" th:errors="*{medicineName}">
              </p>
            </div>
            <div class="field">
              <label for="usage">
                用法
                <span class="required">
                  必須
                </span>
              </label>
              <input id="usage" type="text" th:field="*{usage}" maxlength="200" placeholder="例：1日3回 毎食後" required>
              <p class="field-error" th:if="${#fields.hasErrors('usage')}" th:errors="*{usage}">
              </p>
            </div>
            <div class="field">
              <label for="dosage">
                用量
                <span class="required">
                  必須
                </span>
              </label>
              <input id="dosage" type="text" th:field="*{dosage}" maxlength="100" placeholder="例：1回1錠" required>
              <p class="field-error" th:if="${#fields.hasErrors('dosage')}" th:errors="*{dosage}">
              </p>
            </div>
            <div class="field">
              <label for="durationDays">
                服用日数
                <span class="required">
                  必須
                </span>
              </label>
              <input id="durationDays" type="number" th:field="*{durationDays}" min="1" step="1" max="2147483647" required>
              <p class="field-error" th:if="${#fields.hasErrors('durationDays')}" th:errors="*{durationDays}">
              </p>
            </div>
          </div>
          <div id="additional-medicines">
            <fieldset class="additional-medicine" th:each="medicine, item : *{additionalMedicines}">
              <legend>追加の薬剤</legend>
              <div class="form-grid">
                <div class="field">
                  <label th:for="|additionalMedicines${item.index}.medicineName|">薬剤名<span class="required">必須</span></label>
                  <input type="text" data-medicine-field="medicineName" th:field="*{additionalMedicines[__${item.index}__].medicineName}" maxlength="200" required>
                  <p class="field-error" th:if="${#fields.hasErrors('additionalMedicines[' + item.index + '].medicineName')}" th:errors="*{additionalMedicines[__${item.index}__].medicineName}"></p>
                </div>
                <div class="field">
                  <label th:for="|additionalMedicines${item.index}.usage|">用法<span class="required">必須</span></label>
                  <input type="text" data-medicine-field="usage" th:field="*{additionalMedicines[__${item.index}__].usage}" maxlength="200" required>
                  <p class="field-error" th:if="${#fields.hasErrors('additionalMedicines[' + item.index + '].usage')}" th:errors="*{additionalMedicines[__${item.index}__].usage}"></p>
                </div>
                <div class="field">
                  <label th:for="|additionalMedicines${item.index}.dosage|">用量<span class="required">必須</span></label>
                  <input type="text" data-medicine-field="dosage" th:field="*{additionalMedicines[__${item.index}__].dosage}" maxlength="100" required>
                  <p class="field-error" th:if="${#fields.hasErrors('additionalMedicines[' + item.index + '].dosage')}" th:errors="*{additionalMedicines[__${item.index}__].dosage}"></p>
                </div>
                <div class="field">
                  <label th:for="|additionalMedicines${item.index}.durationDays|">服用日数<span class="required">必須</span></label>
                  <input type="number" data-medicine-field="durationDays" th:field="*{additionalMedicines[__${item.index}__].durationDays}" min="1" step="1" max="2147483647" required>
                  <p class="field-error" th:if="${#fields.hasErrors('additionalMedicines[' + item.index + '].durationDays')}" th:errors="*{additionalMedicines[__${item.index}__].durationDays}"></p>
                </div>
              </div>
              <button class="button secondary small" type="button" data-remove-medicine>削除</button>
            </fieldset>
          </div>
          <button class="button secondary small" type="button" id="add-medicine">＋ 薬剤・用法・用量・服用日数を追加</button>
          <p class="muted">処方日・服薬指導内容・備考は、入力したすべての薬剤に共通です。</p>
          <div class="field">
            <label for="guidance">
              服薬指導内容
              <span class="required">
                必須
              </span>
            </label>
            <textarea id="guidance" th:field="*{guidance}" rows="4" maxlength="5000" required>
            </textarea>
            <p class="field-error" th:if="${#fields.hasErrors('guidance')}" th:errors="*{guidance}">
            </p>
          </div>
          <div class="field">
            <label for="notes">
              備考
              <span class="muted">
                任意
              </span>
            </label>
            <textarea id="notes" th:field="*{notes}" rows="4" maxlength="5000" >
            </textarea>
            <p class="field-error" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}">
            </p>
          </div>
          <div class="actions">
            <button class="button" type="submit">
              薬歴を登録する
            </button>
            <a class="button secondary" th:href="@{/patients/{id}/medications(id=${patient.id})}">
              過去の薬歴を確認
            </a>
          </div>
        </form>
      </section>
      <a class="back" th:href="@{/}">
        ← ホームへ戻る
      </a>
    </main>
    <footer th:replace="~{fragments :: footer}">
    </footer>
  </body>
</html>
